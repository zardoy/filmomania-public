name: Build and Release

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Prepare build metadata
      shell: bash
      run: node prepare.mjs ${{ github.run_number }}

    - name: Build app
      run: pnpm run build-app-github
      env:
        SERVER_URL: ${{ secrets.SERVER_URL }}

    - name: Build Windows executable
      run: pnpm run electron-pack-win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: filmomania-windows
        path: |
          release/FilmoMania*.exe
          release/latest.yml
          release/*.blockmap
        retention-days: 30

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Prepare build metadata
      shell: bash
      run: node prepare.mjs ${{ github.run_number }}

    - name: Build app
      run: pnpm run build-app-github
      env:
        SERVER_URL: ${{ secrets.SERVER_URL }}

    - name: Build macOS DMG
      run: pnpm run electron-pack-mac
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Fix macOS app permissions
      run: |
        echo "🔧 Fixing macOS app permissions..."
        find ./release -name "*.app" -exec xattr -cr {} \;
        find ./release -name "*.dmg" -exec xattr -cr {} \;

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: filmomania-macos
        path: |
          release/FilmoMania*.dmg
          release/latest-mac.yml
          release/*.blockmap
        retention-days: 30

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: filmomania-windows
        path: ./release-artifacts/

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: filmomania-macos
        path: ./release-artifacts/

    - name: Prepare build version
      shell: bash
      run: node prepare.mjs ${{ github.run_number }}

    - name: Get version from package.json
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: List artifacts
      run: |
        echo "=== Release artifacts ==="
        ls -la ./release-artifacts/
        echo "=== Finding exact filenames ==="
        WIN_FILE=$(find ./release-artifacts/ -name "*.exe" -type f | head -n 1)
        WIN_LATEST=$(find ./release-artifacts/ -name "latest.yml" -type f | head -n 1)
        MAC_FILE=$(find ./release-artifacts/ -name "*.dmg" -type f | head -n 1)
        MAC_LATEST=$(find ./release-artifacts/ -name "latest-mac.yml" -type f | head -n 1)
        echo "WIN_FILE=${WIN_FILE}" >> $GITHUB_ENV
        echo "WIN_LATEST=${WIN_LATEST}" >> $GITHUB_ENV
        echo "MAC_FILE=${MAC_FILE}" >> $GITHUB_ENV
        echo "MAC_LATEST=${MAC_LATEST}" >> $GITHUB_ENV
        echo "Windows file: ${WIN_FILE}"
        echo "Windows latest: ${WIN_LATEST}"
        echo "macOS file: ${MAC_FILE}"
        echo "macOS latest: ${MAC_LATEST}"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.package-version.outputs.version }}
        release_name: FilmoMania Beta v${{ steps.package-version.outputs.version }}
        body: |
          🚀 **Development Build**

          This is an automated development build from the `dev` branch.

          **Changes in this build:**
          - Latest development features and fixes
          - Remote torrent/magnet playing functionality
          - QR code support for mobile remote control
          - Auto-update support enabled

          **Downloads:**
          - Windows: See attached assets
          - macOS (Apple Silicon): See attached assets

          ⚠️ **Note:** This is a development build and may contain bugs or unstable features.
        draft: false
        prerelease: false

    - name: Upload Windows Setup
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.WIN_FILE }}
        asset_name: FilmoMania-Beta-${{ steps.package-version.outputs.version }}-Windows.exe
        asset_content_type: application/octet-stream

    - name: Upload Windows Latest YML
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.WIN_LATEST }}
        asset_name: latest.yml
        asset_content_type: application/x-yaml

    - name: Upload macOS Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.MAC_FILE }}
        asset_name: FilmoMania-Beta-${{ steps.package-version.outputs.version }}-macOS-ARM64.dmg
        asset_content_type: application/octet-stream

    - name: Upload macOS Latest YML
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.MAC_LATEST }}
        asset_name: latest-mac.yml
        asset_content_type: application/x-yaml
